name: Update signals

on:
  schedule:
    # A backup. The regular beat (every 10 minutes while markets are open) comes from the "Refresh loop" workflow,
    # because GitHub's cron is best-effort. This line asks once an hour on weekdays, away from the busy :00 minute.
    - cron: "7 3-20 * * 1-5"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to Telegram first"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # lets the run append to the 'data' branch (the track-record ledger); the main branch is never changed
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send a test alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.build --test-alert

      - name: Test (the site is not published if a test fails)
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/ipo.test.js tests/rules.test.js tests/updater.test.js

      - name: Build data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          python -m engine.build --out site --prev "https://$OWNER.github.io/$REPO/"

      - name: Verify the build is intact (nothing is published if it is not; the QA sweep is printed as a report)
        run: python tools/verify_build.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Tell the operator if the run failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m engine.build --notify-failure

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
